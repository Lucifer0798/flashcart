name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # A second push to the same branch makes the first run's result irrelevant.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------------------------
  # Tier 1: no Docker. Fails in under a minute when it fails, which is most of the time.
  # --------------------------------------------------------------------------------------------
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile everything, run the fast tests
        run: ./mvnw -B verify -DskipITs

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-reports
          path: services/*/target/surefire-reports/
          retention-days: 7

  # --------------------------------------------------------------------------------------------
  # Tier 2: real PostgreSQL and a real broker, per module and in parallel.
  #
  # Split by module rather than run as one job so a failure names the service immediately, and so
  # the slowest module (inventory, which runs the concurrency suite and a real Kafka) does not set
  # the wall-clock time for all of them.
  # --------------------------------------------------------------------------------------------
  integration:
    name: Integration (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      # One module failing should not hide the others: with fail-fast a single flake tells you
      # nothing about whether anything else works.
      fail-fast: false
      matrix:
        module: [catalog, inventory, order, payment, shipping]
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Integration tests
        run: ./mvnw -B -pl services/${{ matrix.module }} -am verify -Dsurefire.skip=true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: it-reports-${{ matrix.module }}
          path: services/*/target/failsafe-reports/
          retention-days: 7

  # --------------------------------------------------------------------------------------------
  # Tier 3: the whole platform, as it actually ships.
  #
  # Everything above tests services one at a time. This is the only job that can catch a wrong
  # topic name between two services, a compose environment variable nobody set, or a route the
  # gateway does not have — none of which any module's own suite can see.
  # --------------------------------------------------------------------------------------------
  platform:
    name: Whole platform, end to end
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v5

      - name: Build all images
        run: docker compose build

      - name: Start the stack and wait for health
        run: |
          docker compose up -d
          echo "Waiting for every service to report healthy..."
          for i in $(seq 1 90); do
            unhealthy=$(docker compose ps --format '{{.Service}} {{.Health}}' \
              | awk '$2 != "healthy" && $2 != "" { print $1 }')
            if [ -z "$unhealthy" ]; then
              echo "All services healthy."
              exit 0
            fi
            sleep 5
          done
          echo "Still not healthy: $unhealthy"
          docker compose logs --tail=200
          exit 1

      - name: Catalog and inventory still work
        run: |
          set -e
          G=http://localhost:18080
          echo "--- a live flash sale is seeded ---"
          curl -sf $G/api/v1/flash-sales/active | grep -q '"phase":"ACTIVE"'
          echo "--- the listing applies the sale price ---"
          curl -sf "$G/api/v1/products?status=ACTIVE&size=50" | grep -q '"onFlashSale":true'
          echo "--- every service reports itself live ---"
          for s in inventory order payment shipping; do
            curl -sf "$G/api/v1/$s/_info" | grep -q '"status":"live"'
          done
          curl -sf $G/api/v1/user/_info | grep -q '"status":"skeleton"'

      - name: Sign in as the operator, because stock is no longer anyone's to receive
        run: |
          set -e
          OPERATOR=$(./scripts/operator-token.sh)
          test -n "$OPERATOR"
          echo "OPERATOR=$OPERATOR" >> $GITHUB_ENV
          echo "got an operator token"

      - name: Sign in, because a checkout now needs a shopper
        run: |
          set -e
          G=http://localhost:18080
          EMAIL="ci-$(date +%s)@example.test"
          PASS="a-sufficiently-long-password"

          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST $G/api/v1/users -H 'Content-Type: application/json' -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\",\"displayName\":\"CI Shopper\"}")
          test "$CODE" = "201"

          TOKEN=$(curl -s -X POST $G/api/v1/users/sessions -H 'Content-Type: application/json' -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\"}" | grep -o '"accessToken":"[^"]*"' | cut -d'"' -f4)
          test -n "$TOKEN"
          echo "TOKEN=$TOKEN" >> $GITHUB_ENV
          echo "signed in as $EMAIL"

      - name: A checkout settles asynchronously across four services
        run: |
          set -e
          G=http://localhost:18080
          SKU=AUD-HP-001
          curl -sf -X POST $G/api/v1/inventory/stock -H 'Content-Type: application/json' -H "Authorization: Bearer $OPERATOR" \
            -d "{\"sku\":\"$SKU\",\"initialQuantity\":10,\"reason\":\"CI\"}" > /dev/null

          # 202: the order exists, but whether it got the stock is settled on the bus.
          curl -s -o /tmp/o.json -w '%{http_code}' -X POST $G/api/v1/orders \
            -H 'Content-Type: application/json' -H "Authorization: Bearer $TOKEN" \
            -d "{\"idempotencyKey\":\"ci-$(date +%s)\",\"lines\":[{\"sku\":\"$SKU\",\"quantity\":1}]}" \
            | grep -q '^202$'
          grep -q '"status":"CREATED"' /tmp/o.json
          ORDER=$(sed -n 's/.*"orderNumber":"\([^"]*\)".*/\1/p' /tmp/o.json)
          echo "placed $ORDER"

          # This is the assertion that matters: order -> Kafka -> inventory -> Kafka -> order ->
          # Kafka -> payment -> Kafka -> order -> Kafka -> shipping. If any topic name, serializer
          # or consumer group is wrong, the order simply never leaves CREATED.
          for i in $(seq 1 60); do
            STATUS=$(curl -sf -H "Authorization: Bearer $TOKEN" "$G/api/v1/orders/$ORDER" | sed -n 's/.*"status":"\([A-Z_]*\)".*/\1/p')
            echo "  $ORDER is $STATUS"
            case "$STATUS" in
              FULFILLING|SHIPPED) echo "saga completed"; exit 0 ;;
              CANCELLED) echo "order was cancelled unexpectedly"; curl -s -H "Authorization: Bearer $TOKEN" "$G/api/v1/orders/$ORDER/history"; exit 1 ;;
            esac
            sleep 2
          done
          echo "order never progressed past $STATUS"
          curl -s -H "Authorization: Bearer $TOKEN" "$G/api/v1/orders/$ORDER/history"
          docker compose logs --tail=100 order inventory payment shipping
          exit 1

      - name: A declined payment compensates and gives the stock back
        run: |
          set -e
          G=http://localhost:18080
          # The simulated provider declines any amount ending in .13, and the catalog seed has a
          # product priced at 24.99 -> so use one whose total lands on .13 via quantity.
          SKU=CI-DECLINE-$(date +%s)
          curl -sf -X POST $G/api/v1/inventory/stock -H 'Content-Type: application/json' -H "Authorization: Bearer $OPERATOR" \
            -d "{\"sku\":\"$SKU\",\"initialQuantity\":5,\"reason\":\"CI decline\"}" > /dev/null
          CAT=$(curl -sf $G/api/v1/categories | sed -n 's/.*"id":"\([^"]*\)".*/\1/p' | head -1)
          curl -sf -X POST $G/api/v1/products -H 'Content-Type: application/json' \
            -d "{\"sku\":\"$SKU\",\"name\":\"CI Decline Probe\",\"categoryId\":\"$CAT\",\"basePrice\":10.13,\"currency\":\"USD\",\"status\":\"ACTIVE\"}" > /dev/null

          curl -s -o /tmp/d.json -X POST $G/api/v1/orders -H 'Content-Type: application/json' -H "Authorization: Bearer $TOKEN" \
            -d "{\"idempotencyKey\":\"ci-decline-$(date +%s)\",\"lines\":[{\"sku\":\"$SKU\",\"quantity\":1}]}"
          ORDER=$(sed -n 's/.*"orderNumber":"\([^"]*\)".*/\1/p' /tmp/d.json)
          echo "placed $ORDER at 10.13, which the simulated provider declines"

          for i in $(seq 1 60); do
            STATUS=$(curl -sf -H "Authorization: Bearer $TOKEN" "$G/api/v1/orders/$ORDER" | sed -n 's/.*"status":"\([A-Z_]*\)".*/\1/p')
            if [ "$STATUS" = "CANCELLED" ]; then
              echo "compensated"
              # PAYMENT_FAILED must appear on the way through: compensation is a recorded state.
              curl -sf -H "Authorization: Bearer $TOKEN" "$G/api/v1/orders/$ORDER/history" | grep -q '"toStatus":"PAYMENT_FAILED"'

              # The units come back on a further hop, so this is polled rather than read once.
              # CANCELLED means the order service has recorded the outcome; it does not mean
              # inventory has yet consumed the release. Since Phase 8 that gap is wider, because
              # every message now waits for the outbox relay's next tick. Asserting immediately
              # here passed for six phases and then failed roughly half the time.
              for j in $(seq 1 15); do
                RESERVED=$(curl -sf "$G/api/v1/inventory/stock/$SKU" | grep -o '"reserved":[0-9]*' | cut -d: -f2)
                # An "if", not "[ ... ] && exit 0": under set -e a failing && list ends the step,
                # so the shorter form would abort on the first poll instead of retrying.
                if [ "$RESERVED" = "0" ]; then exit 0; fi
                sleep 2
              done
              echo "compensation never returned the units (reserved=$RESERVED)"
              curl -s "$G/api/v1/inventory/stock/$SKU"
              docker compose logs --tail=100 inventory order
              exit 1
            fi
            sleep 2
          done
          echo "declined order never reached CANCELLED (stuck at $STATUS)"
          curl -s -H "Authorization: Bearer $TOKEN" "$G/api/v1/orders/$ORDER/history"
          docker compose logs --tail=100 order payment
          exit 1

      - name: The shared error envelope survives every hop
        run: |
          set -e
          G=http://localhost:18080
          curl -s $G/api/v1/products/00000000-0000-4000-8000-0000000000ff | grep -q '"code":"NOT_FOUND"'
          # A wrong verb is a 405, not a 500 — the whole platform shares one handler for this.
          curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $TOKEN" $G/api/v1/orders | grep -qE '^40[45]$'

      - name: A client cannot say who it is
        run: |
          set -e
          G=http://localhost:18080
          SKU=CI-AUTH-$(date +%s)
          curl -sf -X POST $G/api/v1/inventory/stock -H 'Content-Type: application/json' -H "Authorization: Bearer $OPERATOR"             -d "{\"sku\":\"$SKU\",\"initialQuantity\":5,\"reason\":\"CI auth\"}" > /dev/null
          CAT=$(curl -sf $G/api/v1/categories | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          curl -sf -X POST $G/api/v1/products -H 'Content-Type: application/json'             -d "{\"sku\":\"$SKU\",\"name\":\"CI auth probe $SKU\",\"categoryId\":\"$CAT\",\"basePrice\":19.00,\"currency\":\"USD\",\"status\":\"ACTIVE\"}" > /dev/null

          # 1. No token, no checkout.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST $G/api/v1/orders             -H 'Content-Type: application/json'             -d "{\"idempotencyKey\":\"ci-anon-$(date +%s%N)\",\"lines\":[{\"sku\":\"$SKU\",\"quantity\":1}]}")
          echo "anonymous checkout: $CODE"
          test "$CODE" = "401"

          # 2. A second shopper cannot read or cancel the first one's order. 404 rather than 403,
          #    because 403 would confirm the order number is real.
          EMAIL2="ci-other-$(date +%s)@example.test"; PASS="a-sufficiently-long-password"
          curl -sf -X POST $G/api/v1/users -H 'Content-Type: application/json'             -d "{\"email\":\"$EMAIL2\",\"password\":\"$PASS\",\"displayName\":\"Other\"}" > /dev/null
          OTHER=$(curl -s -X POST $G/api/v1/users/sessions -H 'Content-Type: application/json' -d "{\"email\":\"$EMAIL2\",\"password\":\"$PASS\"}" | grep -o '"accessToken":"[^"]*"' | cut -d'"' -f4)

          MINE=$(curl -s -X POST $G/api/v1/orders -H 'Content-Type: application/json' -H "Authorization: Bearer $TOKEN"             -d "{\"idempotencyKey\":\"ci-mine-$(date +%s%N)\",\"lines\":[{\"sku\":\"$SKU\",\"quantity\":1}]}" | grep -o '"orderNumber":"[^"]*"' | cut -d'"' -f4)
          test -n "$MINE"

          READ=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $OTHER" "$G/api/v1/orders/$MINE")
          KILL=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $OTHER" "$G/api/v1/orders/$MINE/cancel")
          echo "stranger read: $READ, stranger cancel: $KILL"
          test "$READ" = "404"
          test "$KILL" = "404"

          # 3. The gateway is not the boundary. Straight to the order service's own published port
          #    with a forged header -- which is exactly what a header-trusting design would accept.
          # A VALID body on purpose. An invalid one returns 400 from bean validation, which runs
          # before the controller method and therefore before the token is checked -- so the test
          # would pass while proving nothing about authentication. Worth knowing in its own right:
          # the service parses and validates unauthenticated input before turning it away, which is
          # work done for a caller that has not identified itself.
          BYPASS=$(docker compose exec -T order wget -qO-             --post-data="{\"idempotencyKey\":\"ci-bypass-$(date +%s%N)\",\"lines\":[{\"sku\":\"$SKU\",\"quantity\":1}]}"             --header='Content-Type: application/json' --header='X-Customer-Id: someone-else'             --server-response http://localhost:8082/api/v1/orders 2>&1 | grep -o 'HTTP/1.1 [0-9]*' | head -1 | grep -o '[0-9]*$' || true)
          echo "forged header, valid body, straight to the service: ${BYPASS:-none}"
          test "${BYPASS:-none}" = "401"

      - name: A shopper is not a warehouse
        run: |
          set -e
          G=http://localhost:18080
          SKU=CI-OPS-$(date +%s)

          # A shopper's token is a perfectly valid token. It is not an operator, and receiving stock
          # is not something being signed in should authorise.
          SHOPPER=$(curl -s -o /dev/null -w '%{http_code}' -X POST $G/api/v1/inventory/stock             -H 'Content-Type: application/json' -H "Authorization: Bearer $TOKEN"             -d "{\"sku\":\"$SKU\",\"initialQuantity\":5,\"reason\":\"should be refused\"}")
          echo "shopper receiving stock: $SHOPPER"
          test "$SHOPPER" = "403"

          # No token at all is 401 rather than 403: nothing to check the role of.
          ANON=$(curl -s -o /dev/null -w '%{http_code}' -X POST $G/api/v1/inventory/stock             -H 'Content-Type: application/json'             -d "{\"sku\":\"$SKU\",\"initialQuantity\":5,\"reason\":\"should be refused\"}")
          echo "anonymous receiving stock: $ANON"
          test "$ANON" = "401"

          # The operator can.
          OPS=$(curl -s -o /dev/null -w '%{http_code}' -X POST $G/api/v1/inventory/stock             -H 'Content-Type: application/json' -H "Authorization: Bearer $OPERATOR"             -d "{\"sku\":\"$SKU\",\"initialQuantity\":5,\"reason\":\"CI ops\"}")
          echo "operator receiving stock: $OPS"
          test "$OPS" = "201"

          # Availability stays public: a shopper needs to know how many are left.
          AVAIL=$(curl -s -o /dev/null -w '%{http_code}' "$G/api/v1/inventory/stock/$SKU")
          echo "anonymous availability read: $AVAIL"
          test "$AVAIL" = "200"

          # Availability is public for ONE more segment, and no further. The endpoints one step
          # deeper -- the movement ledger, the receive and adjust paths -- sit under the same
          # prefix, so a `/stock/**` rule would have exposed the lot while this check still
          # passed. That is the whole reason the rule is a single star.
          LEDGER=$(curl -s -o /dev/null -w '%{http_code}' "$G/api/v1/inventory/stock/$SKU/movements")
          echo "anonymous movement ledger: $LEDGER"
          test "$LEDGER" = "401"

          # Nor does it expose the list of every SKU in the system.
          LIST=$(curl -s -o /dev/null -w '%{http_code}' "$G/api/v1/inventory/stock")
          echo "anonymous stock list: $LIST"
          test "$LIST" = "401"

          # And the services enforce it themselves, not just the gateway -- straight to the port
          # compose publishes, which is exactly what bypassing the edge looks like. If this ever
          # comes back 201, the gateway was the only thing standing between the internet and the
          # stock ledger.
          DIRECT=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:18085/api/v1/inventory/stock             -H 'Content-Type: application/json' -H "Authorization: Bearer $TOKEN"             -d "{\"sku\":\"$SKU-direct\",\"initialQuantity\":5,\"reason\":\"bypass\"}")
          echo "shopper token straight to inventory:18085: $DIRECT"
          test "$DIRECT" = "403"

          # The published port is genuinely reachable, so the 403 above is a refusal and not a
          # connection failure quietly rendering as one.
          DIRECTOK=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:18085/api/v1/inventory/stock/$SKU")
          echo "direct availability read: $DIRECTOK"
          test "$DIRECTOK" = "200"

          # Payment and shipping got the same filter, so the same two questions get asked of them.
          # Not because the filter might behave differently -- it is one class -- but because each
          # service has to actually register it, and a service that forgot would look exactly like
          # a service that did until somebody sent it a request. ADR 0022 claims three services are
          # closed; this is the part that makes that a check rather than a claim.
          # These two are no longer operator-only: since ADR 0023 a customer reads their own. What
          # stays refused is naming somebody else, which is what customerId here does -- so a
          # shopper gets 403 not because the endpoint is closed but because the row is not theirs.
          # The customer's own view is asserted in its own step below, against a real order.
          for RES in payments shipments; do
            Q="$G/api/v1/$RES?customerId=ci-does-not-matter"
            SHOP=$(curl -s -o /dev/null -w '%{http_code}' "$Q" -H "Authorization: Bearer $TOKEN")
            NONE=$(curl -s -o /dev/null -w '%{http_code}' "$Q")
            OK=$(curl -s -o /dev/null -w '%{http_code}' "$Q" -H "Authorization: Bearer $OPERATOR")
            echo "$RES -- shopper: $SHOP  anonymous: $NONE  operator: $OK"
            test "$SHOP" = "403"
            test "$NONE" = "401"
            test "$OK" = "200"
          done

      - name: A customer can see their own payment and parcel, and nobody else's
        run: |
          set -e
          G=http://localhost:18080

          # A second shopper, so "not yours" is a real other account rather than a missing token.
          OTHER_EMAIL="other-$(date +%s)@example.test"
          PASS="a-sufficiently-long-password"
          curl -s -o /dev/null -X POST $G/api/v1/users -H 'Content-Type: application/json' \
            -d "{\"email\":\"$OTHER_EMAIL\",\"password\":\"$PASS\",\"displayName\":\"CI Other\"}"
          OTHER=$(curl -s -X POST $G/api/v1/users/sessions -H 'Content-Type: application/json' \
            -d "{\"email\":\"$OTHER_EMAIL\",\"password\":\"$PASS\"}" | grep -o '"accessToken":"[^"]*"' | cut -d'"' -f4)
          test -n "$OTHER"

          # An order of our own to look at, on the SKU the saga step already stocked and priced.
          curl -s -o /tmp/own.json -X POST $G/api/v1/orders \
            -H 'Content-Type: application/json' -H "Authorization: Bearer $TOKEN" \
            -d "{\"idempotencyKey\":\"ci-own-$(date +%s)\",\"lines\":[{\"sku\":\"AUD-HP-001\",\"quantity\":1}]}"
          ORDER=$(sed -n 's/.*"orderNumber":"\([^"]*\)".*/\1/p' /tmp/own.json)
          test -n "$ORDER"
          echo "placed $ORDER as the shopper"

          # Payment and shipment are created on the bus, so they arrive when they arrive.
          for i in $(seq 1 60); do
            PAY=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$G/api/v1/payments/order/$ORDER")
            if [ "$PAY" = "200" ]; then break; fi
            sleep 2
          done
          echo "shopper reading their own payment:  $PAY"
          test "$PAY" = "200"

          for i in $(seq 1 60); do
            SHIP=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$G/api/v1/shipments/order/$ORDER")
            if [ "$SHIP" = "200" ]; then break; fi
            sleep 2
          done
          echo "shopper reading their own shipment: $SHIP"
          test "$SHIP" = "200"

          # The assertion this whole change lives or dies on. 404 rather than 403, because a 403
          # confirms the order number is real, and order numbers are short and guessable.
          NOTYOURS_PAY=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $OTHER" "$G/api/v1/payments/order/$ORDER")
          NOTYOURS_SHIP=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $OTHER" "$G/api/v1/shipments/order/$ORDER")
          echo "another customer reading it:       payment $NOTYOURS_PAY  shipment $NOTYOURS_SHIP"
          test "$NOTYOURS_PAY" = "404"
          test "$NOTYOURS_SHIP" = "404"

          # A tracking number is printed on a label and read aloud to carriers, so it gets the same
          # treatment as the order number.
          TRACKING=$(curl -s -H "Authorization: Bearer $TOKEN" "$G/api/v1/shipments/order/$ORDER" | grep -o '"trackingNumber":"[^"]*"' | cut -d'"' -f4)
          test -n "$TRACKING"
          BYTRACK=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $OTHER" "$G/api/v1/shipments/$TRACKING")
          echo "another customer by tracking:      $BYTRACK"
          test "$BYTRACK" = "404"

          # Your own listing needs no parameter naming you.
          MINE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$G/api/v1/payments")
          echo "shopper listing their own:         $MINE"
          test "$MINE" = "200"

          # And the listing is scoped: the other shopper's is empty while ours is not.
          COUNT_OTHER=$(curl -s -H "Authorization: Bearer $OTHER" "$G/api/v1/payments" | grep -o '"id"' | wc -l)
          COUNT_MINE=$(curl -s -H "Authorization: Bearer $TOKEN" "$G/api/v1/payments" | grep -o '"id"' | wc -l)
          echo "listing sizes: ours=$COUNT_MINE theirs=$COUNT_OTHER"
          test "$COUNT_OTHER" = "0"
          test "$COUNT_MINE" != "0"

          # Naming somebody else is refused outright rather than silently answered with your own,
          # which would read as success to whoever wrote the call.
          ASKING=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$G/api/v1/payments?customerId=somebody-else")
          echo "shopper naming another customer:   $ASKING"
          test "$ASKING" = "403"

          # A customer may watch a parcel move, not move it.
          DISPATCH=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" "$G/api/v1/shipments/$TRACKING/dispatch")
          echo "shopper dispatching their parcel:  $DISPATCH"
          test "$DISPATCH" = "403"

          # The operator is unaffected by any of this.
          OPS=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $OPERATOR" "$G/api/v1/payments/order/$ORDER")
          echo "operator reading it:               $OPS"
          test "$OPS" = "200"

          # And that read is now on the record. The shopper read this same order twice above, so a
          # count of exactly one proves both halves of ADR 0025 in a single number: the operator's
          # access was recorded, and the customer's own reads were not.
          AUDIT=$(docker compose exec -T postgres psql -U flashcart -d flashcart_payment -tAc             "select count(*) from operator_access_log where resource_id = '$ORDER'" | tr -d '[:space:]')
          echo "audit rows for $ORDER:             $AUDIT"
          test "$AUDIT" = "1"

          WHO=$(docker compose exec -T postgres psql -U flashcart -d flashcart_payment -tAc             "select operator_id || ' ' || action from operator_access_log where resource_id = '$ORDER'" | tr -d '[:space:]')
          echo "recorded as:                       $WHO"
          echo "$WHO" | grep -q 'READ_PAYMENT'

          # The same again in shipping's own database, because the table is per service and a
          # service that forgot to write to it would look exactly like one with nothing to record.
          SOPS=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $OPERATOR" "$G/api/v1/shipments/order/$ORDER")
          test "$SOPS" = "200"
          SAUDIT=$(docker compose exec -T postgres psql -U flashcart -d flashcart_shipping -tAc             "select count(*) from operator_access_log where resource_id = '$ORDER'" | tr -d '[:space:]')
          echo "shipping audit rows for $ORDER:    $SAUDIT"
          test "$SAUDIT" = "1"

      - name: The outbox drained
        run: |
          set -e
          # Every message above was published through the outbox, so by now every row should be
          # stamped. A row left unpublished means the relay is not draining — the saga would still
          # have looked healthy above, because the messages that mattered got through before it
          # stalled. This is the assertion that catches a relay dying quietly.
          for db in order inventory payment shipping; do
            STUCK=$(docker compose exec -T postgres psql -U flashcart -d flashcart_$db -tAc "select count(*) from outbox_messages where published_at is null and created_at < now() - interval '30 seconds'")
            echo "$db: $STUCK message(s) stuck in the outbox"
            test "$STUCK" -eq 0
          done
          # And the consumers recorded what they handled, rather than relying on the state machine
          # to quietly ignore replays.
          CLAIMS=$(docker compose exec -T postgres psql -U flashcart -d flashcart_order -tAc "select count(*) from processed_events")
          echo "order recorded $CLAIMS processed event(s)"
          test "$CLAIMS" -gt 0

      - name: The platform is observable
        run: |
          set -e
          # Every service has listed `prometheus` in its actuator exposure since Phase 1. Until
          # Phase 9 added the micrometer registry that line was aspirational and the endpoint
          # returned 404 -- exactly the kind of config that looks right and does nothing, which is
          # why it is asserted here rather than assumed.
          for s in gateway:8080 catalog:8081 order:8082 user:8083 payment:8084 inventory:8085 shipping:8086; do
            NAME=${s%%:*}
            docker compose exec -T $NAME wget -qO- "http://localhost:${s##*:}/actuator/prometheus" | grep -q '^# HELP' || { echo "$NAME exposes no metrics"; exit 1; }
            echo "$NAME is scrapeable"
          done

          # Prometheus must have actually scraped them. A green target list is the difference between
          # "the endpoint exists" and "the endpoint is being collected", and only the second is
          # observability.
          for i in $(seq 1 30); do
            UP=$(docker compose exec -T prometheus wget -qO- 'http://localhost:9090/api/v1/query?query=up{job="flashcart"}' | grep -o '"value":\[[^]]*,"1"\]' | wc -l)
            echo "  $UP of 7 targets up"
            if [ "$UP" -ge 7 ]; then break; fi
            sleep 5
          done
          test "$UP" -ge 7

          # And the domain metrics must carry real values, not just exist. The checkout above went
          # through the saga, so a transition counter with no samples means the instrumentation is
          # wired to nothing.
          SAGA_RAW=$(docker compose exec -T prometheus wget -qO- 'http://localhost:9090/api/v1/query?query=sum(flashcart_saga_transitions_total)')
          # Unanchored on purpose: the value array ends "4"] so a $ anchor after the quote never
          # matches. That typo made this step report "none" for a metric Prometheus was holding
          # perfectly well -- a check that fails for its own reasons is worse than no check.
          SAGA=$(echo "$SAGA_RAW" | grep -oE '"[0-9.]+"\]' | tr -d '"]')
          echo "saga transitions recorded: ${SAGA:-none}"
          if [ -z "$SAGA" ]; then echo "raw response: $SAGA_RAW"; exit 1; fi

          # The outbox gauge is the one that makes a silently stalled relay visible, so it has to be
          # present and sane -- drained, because everything above completed.
          docker compose exec -T prometheus wget -qO- 'http://localhost:9090/api/v1/query?query=max(flashcart_outbox_oldest_age_seconds)' | grep -q '"value"' || { echo "outbox gauge is missing"; exit 1; }

          # Grafana provisioned itself from the repo rather than from a volume someone edited by hand.
          docker compose exec -T grafana wget -qO- http://localhost:3000/api/dashboards/uid/flashcart-overview | grep -q '"title"' 
          echo "grafana dashboard provisioned"

      - name: The anti-oversell invariant holds under concurrency
        run: |
          set -e
          # A small, deliberately un-timed load run. CI cannot measure throughput -- a shared runner
          # is noisier than the laptop that already could not distinguish the configurations -- so
          # this asserts only the thing that is not a matter of degree: with 5 units and 100
          # simultaneous buyers, exactly 5 succeed.
          #
          # It also keeps the harness from rotting. The load script found two real defects in Phase
          # 10 and silently miscounted three times before that; an unused tool would have done
          # neither.
          G=http://localhost:18080
          SKU=CI-RUSH-$(date +%s)
          curl -sf -X POST $G/api/v1/inventory/stock -H 'Content-Type: application/json' -H "Authorization: Bearer $OPERATOR"             -d "{\"sku\":\"$SKU\",\"initialQuantity\":5,\"reason\":\"CI rush\"}" > /dev/null

          docker run --rm --network flashcart_default             -v "$PWD/load/scripts:/scripts:ro"             -e GATEWAY=http://gateway:8080 -e SKU="$SKU" -e VUS=100 -e ITERATIONS=300 -e TOKEN="$OPERATOR"             grafana/k6:0.56.0 run /scripts/flash-sale.js > /tmp/k6.txt 2>&1 || true
          grep -E 'reservations_(granted|refused|shed|errored)' /tmp/k6.txt || true

          GRANTED=$(grep -oE 'reservations_granted[. ]*: *[0-9]+' /tmp/k6.txt | grep -oE '[0-9]+$')
          RESERVED=$(docker compose exec -T postgres psql -U flashcart -d flashcart_inventory -tAc             "select reserved from stock_items where sku = '$SKU'" | tr -d '[:space:]')
          AVAILABLE=$(docker compose exec -T postgres psql -U flashcart -d flashcart_inventory -tAc             "select on_hand - reserved from stock_items where sku = '$SKU'" | tr -d '[:space:]')
          echo "granted=$GRANTED reserved=$RESERVED available=$AVAILABLE"

          # The ledger is the authority; k6 agreeing with it is what makes k6 worth reading.
          test "$RESERVED" = "5"
          test "$AVAILABLE" = "0"
          test "$GRANTED" = "5"

      - name: A checkout is one trace, across the outbox
        run: |
          set -e
          # Not "is Zipkin up" -- that would pass with tracing switched off. This asserts the thing
          # that was actually hard: that a single checkout is ONE trace spanning several services,
          # including the hop where the outbox hands a message to the relay minutes later on another
          # thread. That join is what breaks by default, and four separate misconfigurations during
          # Phase 11 each left it looking configured while producing nothing.
          TP=$(docker compose exec -T postgres psql -U flashcart -d flashcart_order -tAc             "select trace_parent from outbox_messages where trace_parent is not null order by created_at desc limit 1" | tr -d '[:space:]')
          if [ -z "$TP" ]; then echo "no traceparent was stored on any outbox row"; exit 1; fi
          echo "traceparent: $TP"
          TRACE_ID=$(echo "$TP" | cut -d- -f2)

          for i in $(seq 1 12); do
            SPANS=$(docker compose exec -T zipkin wget -qO- "http://localhost:9411/api/v2/trace/$TRACE_ID" || echo '[]')
            COUNT=$(echo "$SPANS" | grep -o '"serviceName"' | wc -l)
            SERVICES=$(echo "$SPANS" | grep -oE '"serviceName":"[a-z-]+"' | sort -u | wc -l)
            echo "  trace has $COUNT spans across $SERVICES service(s)"
            if [ "$SERVICES" -ge 3 ]; then break; fi
            sleep 5
          done

          # Three or more services in one trace means it crossed the bus at least twice: the buyer's
          # request reached order, and the relay's send carried that same trace into a consumer.
          test "$SERVICES" -ge 3
          echo "$SPANS" | grep -oE '"serviceName":"[a-z-]+"' | sort -u

      - name: Nothing was dead-lettered
        run: |
          # A message on the DLQ means a consumer exhausted its retries. Everything above should
          # have been an ordinary business outcome, so the DLQ being non-empty is a real failure
          # even when every assertion above passed.
          # kafka-get-offsets.sh, not kafka-run-class.sh kafka.tools.GetOffsetShell: that class was
          # removed in Kafka 4, so the old call died with ClassNotFoundException, awk summed an empty
          # stream, and this step printed 0 and passed regardless of what sat on the topic. Stderr is
          # no longer discarded either, so a broken invocation fails loudly instead of silently.
          COUNT=$(docker compose exec -T kafka /opt/kafka/bin/kafka-get-offsets.sh \
            --bootstrap-server localhost:9092 \
            --topic flashcart.dlq | awk -F: '{ sum += $3 } END { print sum+0 }')
          echo "dead-letter topic holds $COUNT message(s)"
          test "$COUNT" -eq 0

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=300

      - name: Tear down
        if: always()
        run: docker compose down -v
