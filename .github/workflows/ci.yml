name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # A second push to the same branch makes the first run's result irrelevant.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and unit test
        run: ./mvnw -B verify -DskipITs

      # Separate step from the unit tests so a failure here is unambiguous: the runner has Docker,
      # so an integration-test failure is the code's fault and not a missing daemon.
      - name: Integration tests (Testcontainers)
        run: ./mvnw -B verify -Dsurefire.skip=true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            services/*/target/surefire-reports/
            services/*/target/failsafe-reports/
          retention-days: 7

  docker:
    name: Build service images
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      # Builds every image the way compose does. Catches a broken Dockerfile or a service whose
      # module name and build arg have drifted apart — neither of which the Maven build can see.
      - name: Build all images
        run: docker compose build

      - name: Start the stack and wait for health
        run: |
          docker compose up -d
          echo "Waiting for every service to report healthy..."
          for i in $(seq 1 60); do
            unhealthy=$(docker compose ps --format '{{.Service}} {{.Health}}' \
              | awk '$2 != "healthy" && $2 != "" { print $1 }')
            if [ -z "$unhealthy" ]; then
              echo "All services healthy."
              exit 0
            fi
            sleep 5
          done
          echo "Still not healthy: $unhealthy"
          docker compose logs --tail=100
          exit 1

      # A green health check only proves the processes started. This proves the routing table, the
      # catalog schema and the seed data are all actually working together.
      - name: Smoke-test the platform through the gateway
        run: |
          set -e
          echo "--- catalog: a live flash sale exists ---"
          curl -sf http://localhost:18080/api/v1/flash-sales/active | grep -q '"phase":"ACTIVE"'
          echo "--- catalog: the listing applies the sale price ---"
          curl -sf 'http://localhost:18080/api/v1/products?status=ACTIVE&size=50' | grep -q '"onFlashSale":true'
          echo "--- every not-yet-built service answers through its own gateway route ---"
          for s in user payment shipping; do
            curl -sf "http://localhost:18080/api/v1/$s/_info" | grep -q '"status":"skeleton"'
          done
          echo "--- inventory and order are live, not skeletons ---"
          curl -sf http://localhost:18080/api/v1/inventory/_info | grep -q '"status":"live"'
          curl -sf http://localhost:18080/api/v1/order/_info | grep -q '"status":"live"'

          echo "--- inventory: stock can be created, held, and not oversold ---"
          SKU="CI-SMOKE-$(date +%s)"
          curl -sf -X POST http://localhost:18080/api/v1/inventory/stock \
            -H 'Content-Type: application/json' \
            -d "{\"sku\":\"$SKU\",\"initialQuantity\":2,\"reason\":\"CI smoke test\"}" > /dev/null
          # Two units exist, so the first two holds succeed...
          for n in 1 2; do
            curl -sf -X POST http://localhost:18080/api/v1/inventory/reservations \
              -H 'Content-Type: application/json' \
              -d "{\"reservationKey\":\"ci-$SKU-$n\",\"customerId\":\"ci-$n\",\"lines\":[{\"sku\":\"$SKU\",\"quantity\":1}]}" \
              > /dev/null
          done
          # ...and the third must be refused. A 201 here would mean the platform oversold.
          curl -s -o /tmp/oversell.json -w '%{http_code}' -X POST \
            http://localhost:18080/api/v1/inventory/reservations \
            -H 'Content-Type: application/json' \
            -d "{\"reservationKey\":\"ci-$SKU-3\",\"customerId\":\"ci-3\",\"lines\":[{\"sku\":\"$SKU\",\"quantity\":1}]}" \
            | grep -q '^409$'
          grep -q '"code":"INSUFFICIENT_STOCK"' /tmp/oversell.json
          curl -sf "http://localhost:18080/api/v1/inventory/stock/$SKU" | grep -q '"available":0'

          echo "--- a real checkout: order -> catalog for price, order -> inventory for stock ---"
          # A seeded catalog SKU, so the order service has something to price. Inventory starts
          # empty, so it has to be stocked here before an order can hold any of it.
          curl -sf -X POST http://localhost:18080/api/v1/inventory/stock \
            -H 'Content-Type: application/json' \
            -d '{"sku":"AUD-HP-001","initialQuantity":5,"reason":"CI checkout test"}' > /dev/null
          curl -s -o /tmp/order.json -w '%{http_code}' -X POST http://localhost:18080/api/v1/orders \
            -H 'Content-Type: application/json' \
            -d "{\"idempotencyKey\":\"ci-checkout-$(date +%s)\",\"customerId\":\"ci-buyer\",\"lines\":[{\"sku\":\"AUD-HP-001\",\"quantity\":1}]}" \
            | grep -q '^201$'
          # Priced from catalog at the live flash-sale price, not from anything the request carried.
          grep -q '"status":"RESERVED"' /tmp/order.json
          grep -q '"unitPrice":179' /tmp/order.json
          ORDER=$(sed -n 's/.*"orderNumber":"\([^"]*\)".*/\1/p' /tmp/order.json)
          echo "    placed $ORDER"

          echo "--- cancelling gives the stock back and records why ---"
          curl -sf -X POST "http://localhost:18080/api/v1/orders/$ORDER/cancel" \
            -H 'Content-Type: application/json' -d '{"reason":"CI smoke test"}' \
            | grep -q '"status":"CANCELLED"'
          # The audit trail of the state machine, which is what support reads.
          curl -sf "http://localhost:18080/api/v1/orders/$ORDER/history" | grep -q '"toStatus":"RESERVED"'

          echo "--- the shared error envelope survives the hop ---"
          curl -s http://localhost:18080/api/v1/products/00000000-0000-4000-8000-0000000000ff \
            | grep -q '"code":"NOT_FOUND"'

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
