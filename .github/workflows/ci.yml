name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # A second push to the same branch makes the first run's result irrelevant.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------------------------
  # Tier 1: no Docker. Fails in under a minute when it fails, which is most of the time.
  # --------------------------------------------------------------------------------------------
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile everything, run the fast tests
        run: ./mvnw -B verify -DskipITs

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-reports
          path: services/*/target/surefire-reports/
          retention-days: 7

  # --------------------------------------------------------------------------------------------
  # Tier 2: real PostgreSQL and a real broker, per module and in parallel.
  #
  # Split by module rather than run as one job so a failure names the service immediately, and so
  # the slowest module (inventory, which runs the concurrency suite and a real Kafka) does not set
  # the wall-clock time for all of them.
  # --------------------------------------------------------------------------------------------
  integration:
    name: Integration (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      # One module failing should not hide the others: with fail-fast a single flake tells you
      # nothing about whether anything else works.
      fail-fast: false
      matrix:
        module: [catalog, inventory, order, payment, shipping]
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Integration tests
        run: ./mvnw -B -pl services/${{ matrix.module }} -am verify -Dsurefire.skip=true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: it-reports-${{ matrix.module }}
          path: services/*/target/failsafe-reports/
          retention-days: 7

  # --------------------------------------------------------------------------------------------
  # Tier 3: the whole platform, as it actually ships.
  #
  # Everything above tests services one at a time. This is the only job that can catch a wrong
  # topic name between two services, a compose environment variable nobody set, or a route the
  # gateway does not have — none of which any module's own suite can see.
  # --------------------------------------------------------------------------------------------
  platform:
    name: Whole platform, end to end
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v5

      - name: Build all images
        run: docker compose build

      - name: Start the stack and wait for health
        run: |
          docker compose up -d
          echo "Waiting for every service to report healthy..."
          for i in $(seq 1 90); do
            unhealthy=$(docker compose ps --format '{{.Service}} {{.Health}}' \
              | awk '$2 != "healthy" && $2 != "" { print $1 }')
            if [ -z "$unhealthy" ]; then
              echo "All services healthy."
              exit 0
            fi
            sleep 5
          done
          echo "Still not healthy: $unhealthy"
          docker compose logs --tail=200
          exit 1

      - name: Catalog and inventory still work
        run: |
          set -e
          G=http://localhost:18080
          echo "--- a live flash sale is seeded ---"
          curl -sf $G/api/v1/flash-sales/active | grep -q '"phase":"ACTIVE"'
          echo "--- the listing applies the sale price ---"
          curl -sf "$G/api/v1/products?status=ACTIVE&size=50" | grep -q '"onFlashSale":true'
          echo "--- every service reports itself live ---"
          for s in inventory order payment shipping; do
            curl -sf "$G/api/v1/$s/_info" | grep -q '"status":"live"'
          done
          curl -sf $G/api/v1/user/_info | grep -q '"status":"skeleton"'

      - name: A checkout settles asynchronously across four services
        run: |
          set -e
          G=http://localhost:18080
          SKU=AUD-HP-001
          curl -sf -X POST $G/api/v1/inventory/stock -H 'Content-Type: application/json' \
            -d "{\"sku\":\"$SKU\",\"initialQuantity\":10,\"reason\":\"CI\"}" > /dev/null

          # 202: the order exists, but whether it got the stock is settled on the bus.
          curl -s -o /tmp/o.json -w '%{http_code}' -X POST $G/api/v1/orders \
            -H 'Content-Type: application/json' \
            -d "{\"idempotencyKey\":\"ci-$(date +%s)\",\"customerId\":\"ci-buyer\",\"lines\":[{\"sku\":\"$SKU\",\"quantity\":1}]}" \
            | grep -q '^202$'
          grep -q '"status":"CREATED"' /tmp/o.json
          ORDER=$(sed -n 's/.*"orderNumber":"\([^"]*\)".*/\1/p' /tmp/o.json)
          echo "placed $ORDER"

          # This is the assertion that matters: order -> Kafka -> inventory -> Kafka -> order ->
          # Kafka -> payment -> Kafka -> order -> Kafka -> shipping. If any topic name, serializer
          # or consumer group is wrong, the order simply never leaves CREATED.
          for i in $(seq 1 60); do
            STATUS=$(curl -sf "$G/api/v1/orders/$ORDER" | sed -n 's/.*"status":"\([A-Z_]*\)".*/\1/p')
            echo "  $ORDER is $STATUS"
            case "$STATUS" in
              FULFILLING|SHIPPED) echo "saga completed"; exit 0 ;;
              CANCELLED) echo "order was cancelled unexpectedly"; curl -s "$G/api/v1/orders/$ORDER/history"; exit 1 ;;
            esac
            sleep 2
          done
          echo "order never progressed past $STATUS"
          curl -s "$G/api/v1/orders/$ORDER/history"
          docker compose logs --tail=100 order inventory payment shipping
          exit 1

      - name: A declined payment compensates and gives the stock back
        run: |
          set -e
          G=http://localhost:18080
          # The simulated provider declines any amount ending in .13, and the catalog seed has a
          # product priced at 24.99 -> so use one whose total lands on .13 via quantity.
          SKU=CI-DECLINE-$(date +%s)
          curl -sf -X POST $G/api/v1/inventory/stock -H 'Content-Type: application/json' \
            -d "{\"sku\":\"$SKU\",\"initialQuantity\":5,\"reason\":\"CI decline\"}" > /dev/null
          CAT=$(curl -sf $G/api/v1/categories | sed -n 's/.*"id":"\([^"]*\)".*/\1/p' | head -1)
          curl -sf -X POST $G/api/v1/products -H 'Content-Type: application/json' \
            -d "{\"sku\":\"$SKU\",\"name\":\"CI Decline Probe\",\"categoryId\":\"$CAT\",\"basePrice\":10.13,\"currency\":\"USD\",\"status\":\"ACTIVE\"}" > /dev/null

          curl -s -o /tmp/d.json -X POST $G/api/v1/orders -H 'Content-Type: application/json' \
            -d "{\"idempotencyKey\":\"ci-decline-$(date +%s)\",\"customerId\":\"ci-decline\",\"lines\":[{\"sku\":\"$SKU\",\"quantity\":1}]}"
          ORDER=$(sed -n 's/.*"orderNumber":"\([^"]*\)".*/\1/p' /tmp/d.json)
          echo "placed $ORDER at 10.13, which the simulated provider declines"

          for i in $(seq 1 60); do
            STATUS=$(curl -sf "$G/api/v1/orders/$ORDER" | sed -n 's/.*"status":"\([A-Z_]*\)".*/\1/p')
            if [ "$STATUS" = "CANCELLED" ]; then
              echo "compensated"
              # PAYMENT_FAILED must appear on the way through: compensation is a recorded state.
              curl -sf "$G/api/v1/orders/$ORDER/history" | grep -q '"toStatus":"PAYMENT_FAILED"'

              # The units come back on a further hop, so this is polled rather than read once.
              # CANCELLED means the order service has recorded the outcome; it does not mean
              # inventory has yet consumed the release. Since Phase 8 that gap is wider, because
              # every message now waits for the outbox relay's next tick. Asserting immediately
              # here passed for six phases and then failed roughly half the time.
              for j in $(seq 1 15); do
                RESERVED=$(curl -sf "$G/api/v1/inventory/stock/$SKU" | grep -o '"reserved":[0-9]*' | cut -d: -f2)
                # An "if", not "[ ... ] && exit 0": under set -e a failing && list ends the step,
                # so the shorter form would abort on the first poll instead of retrying.
                if [ "$RESERVED" = "0" ]; then exit 0; fi
                sleep 2
              done
              echo "compensation never returned the units (reserved=$RESERVED)"
              curl -s "$G/api/v1/inventory/stock/$SKU"
              docker compose logs --tail=100 inventory order
              exit 1
            fi
            sleep 2
          done
          echo "declined order never reached CANCELLED (stuck at $STATUS)"
          curl -s "$G/api/v1/orders/$ORDER/history"
          docker compose logs --tail=100 order payment
          exit 1

      - name: The shared error envelope survives every hop
        run: |
          set -e
          G=http://localhost:18080
          curl -s $G/api/v1/products/00000000-0000-4000-8000-0000000000ff | grep -q '"code":"NOT_FOUND"'
          # A wrong verb is a 405, not a 500 — the whole platform shares one handler for this.
          curl -s -o /dev/null -w '%{http_code}' -X DELETE $G/api/v1/orders | grep -qE '^40[45]$'

      - name: The outbox drained
        run: |
          set -e
          # Every message above was published through the outbox, so by now every row should be
          # stamped. A row left unpublished means the relay is not draining — the saga would still
          # have looked healthy above, because the messages that mattered got through before it
          # stalled. This is the assertion that catches a relay dying quietly.
          for db in order inventory payment shipping; do
            STUCK=$(docker compose exec -T postgres psql -U flashcart -d flashcart_$db -tAc "select count(*) from outbox_messages where published_at is null and created_at < now() - interval '30 seconds'")
            echo "$db: $STUCK message(s) stuck in the outbox"
            test "$STUCK" -eq 0
          done
          # And the consumers recorded what they handled, rather than relying on the state machine
          # to quietly ignore replays.
          CLAIMS=$(docker compose exec -T postgres psql -U flashcart -d flashcart_order -tAc "select count(*) from processed_events")
          echo "order recorded $CLAIMS processed event(s)"
          test "$CLAIMS" -gt 0

      - name: The platform is observable
        run: |
          set -e
          # Every service has listed `prometheus` in its actuator exposure since Phase 1. Until
          # Phase 9 added the micrometer registry that line was aspirational and the endpoint
          # returned 404 -- exactly the kind of config that looks right and does nothing, which is
          # why it is asserted here rather than assumed.
          for s in gateway:8080 catalog:8081 order:8082 user:8083 payment:8084 inventory:8085 shipping:8086; do
            NAME=${s%%:*}
            docker compose exec -T $NAME wget -qO- "http://localhost:${s##*:}/actuator/prometheus" | grep -q '^# HELP' || { echo "$NAME exposes no metrics"; exit 1; }
            echo "$NAME is scrapeable"
          done

          # Prometheus must have actually scraped them. A green target list is the difference between
          # "the endpoint exists" and "the endpoint is being collected", and only the second is
          # observability.
          for i in $(seq 1 30); do
            UP=$(docker compose exec -T prometheus wget -qO- 'http://localhost:9090/api/v1/query?query=up{job="flashcart"}' | grep -o '"value":\[[^]]*,"1"\]' | wc -l)
            echo "  $UP of 7 targets up"
            if [ "$UP" -ge 7 ]; then break; fi
            sleep 5
          done
          test "$UP" -ge 7

          # And the domain metrics must carry real values, not just exist. The checkout above went
          # through the saga, so a transition counter with no samples means the instrumentation is
          # wired to nothing.
          SAGA=$(docker compose exec -T prometheus wget -qO- 'http://localhost:9090/api/v1/query?query=sum(flashcart_saga_transitions_total)' | grep -o '"value":\[[^]]*\]' | grep -oE '"[0-9.]+"$' | tr -d '"')
          echo "saga transitions recorded: ${SAGA:-none}"
          test -n "$SAGA"

          # The outbox gauge is the one that makes a silently stalled relay visible, so it has to be
          # present and sane -- drained, because everything above completed.
          docker compose exec -T prometheus wget -qO- 'http://localhost:9090/api/v1/query?query=max(flashcart_outbox_oldest_age_seconds)' | grep -q '"value"' || { echo "outbox gauge is missing"; exit 1; }

          # Grafana provisioned itself from the repo rather than from a volume someone edited by hand.
          docker compose exec -T grafana wget -qO- http://localhost:3000/api/dashboards/uid/flashcart-overview | grep -q '"title"' 
          echo "grafana dashboard provisioned"

      - name: Nothing was dead-lettered
        run: |
          # A message on the DLQ means a consumer exhausted its retries. Everything above should
          # have been an ordinary business outcome, so the DLQ being non-empty is a real failure
          # even when every assertion above passed.
          # kafka-get-offsets.sh, not kafka-run-class.sh kafka.tools.GetOffsetShell: that class was
          # removed in Kafka 4, so the old call died with ClassNotFoundException, awk summed an empty
          # stream, and this step printed 0 and passed regardless of what sat on the topic. Stderr is
          # no longer discarded either, so a broken invocation fails loudly instead of silently.
          COUNT=$(docker compose exec -T kafka /opt/kafka/bin/kafka-get-offsets.sh \
            --bootstrap-server localhost:9092 \
            --topic flashcart.dlq | awk -F: '{ sum += $3 } END { print sum+0 }')
          echo "dead-letter topic holds $COUNT message(s)"
          test "$COUNT" -eq 0

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=300

      - name: Tear down
        if: always()
        run: docker compose down -v
