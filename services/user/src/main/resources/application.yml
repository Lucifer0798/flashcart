spring:
  application:
    name: flashcart-user
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/flashcart_user}
    username: ${SPRING_DATASOURCE_USERNAME:flashcart}
    password: ${SPRING_DATASOURCE_PASSWORD:flashcart}
    hikari:
      # Small: this service is read-light and write-rare. Registration and sign-in are not the
      # contended path, and BCrypt makes sign-in slow on purpose in the CPU, not in the database.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # Explicit, and deliberately not including db/seed: that location holds the development operator
    # account, whose password is readable in this repository. See ADR 0024.
    locations: classpath:db/migration
  kafka:
    # Consumer only: this service hears BackInStock and sends the email (ADR 0046). Observation on
    # both sides, as everywhere else, so the trace a restock started continues into the send.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
  mail:
    # Mailpit in the local stack: an SMTP server that delivers nothing and shows everything at
    # http://localhost:18025. A real relay is a host, a port and credentials away.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      # JavaMail waits for ever by default. A mail server that stops answering mid-connect then holds
      # the sender -- and with it the single scheduler thread every @Scheduled job here shares -- until
      # the OS gives up, minutes later. Found by stopping Mailpit under the running stack: the notice
      # was never even attempted until Mailpit came back. Five seconds, then a recorded failure and a
      # retry with backoff. See ADR 0046.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # health and info for compose/Kubernetes probes; prometheus is claimed in Phase 9.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    mail:
      # Off. Boot's mail indicator connects to SMTP on every health check, so a mail outage reported
      # this whole service DOWN -- to compose, and to anything that restarts unhealthy containers --
      # and sign-in would have gone with it because email had. Sending has its own backlog gauge and
      # alert (NoticesBacklogged), which say the true thing: mail is behind, the service is fine.
      enabled: false
  tracing:
    propagation:
      # W3C rather than Brave's default B3, because the outbox stores the trace context as a
      # traceparent string and replays it when the relay finally sends. One format in the database,
      # on the wire, and in every header, instead of a translation step nobody remembers.
      type: ${TRACE_PROPAGATION:w3c}
    sampling:
      # Everything, because this is a demonstration stack where the interesting traces are the rare
      # ones -- an injected failure, a compensation, a redelivery. Sampling at 10% would mostly
      # discard exactly the traces Phase 11 exists to look at. A real deployment would not do this.
      probability: ${TRACE_SAMPLING:1.0}
    export:
      zipkin:
        # Boot 4 renamed this from management.zipkin.tracing.endpoint. The old key still appears in
        # the configuration metadata, so it binds without complaint and exports nothing.
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    # The correlation id is stamped into the MDC by CorrelationIdFilter in flashcart-common.
    level: "%5p [${spring.application.name},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

flashcart:
  version: ${FLASHCART_VERSION:0.1.0-SNAPSHOT}
  security:
    jwt:
      # HS256, so this value both signs and verifies. Every service that checks a token holds the
      # same string, which is why it must come from the environment in anything real -- the default
      # below exists so `mvn test` and a bare `docker compose up` work, and for no other reason.
      #
      # The day a third party needs to verify one of these, this becomes RS256 and only this service
      # keeps the private half. See ADR 0021.
      secret: ${JWT_SECRET:flashcart-development-secret-do-not-use-anywhere-real}
      ttl: ${JWT_TTL:PT12H}
  notices:
    from: ${NOTICES_FROM:FlashCart <no-reply@flashcart.local>}
    # How often the sender looks for notices due. Short, because a notice is about a unit held for
    # minutes; the backoff for a failing mail server is per notice, not this.
    poll: PT2S
    # How long after the event an email is still worth sending. Past it, skipped as stale: an order
    # confirmation a day late is noise, and one replayed from the topic's history on a first deploy is
    # worse -- which is what happened before this existed. See ADR 0048.
    max-age: ${NOTICES_MAX_AGE:P1D}

---
# The development operator, and nothing else. `demo` adds classpath:db/seed to the Flyway locations,
# so the seeded account can never reach an environment that did not ask for it by name -- the same
# convention the catalog uses for its demo rows.
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/seed
    # The seeds are numbered V900 and up so they run after the schema on a fresh database. On one that
    # already has them, every later schema migration sorts below an applied seed, and Flyway refuses to
    # start: "Detected resolved migration not applied to database". ADR 0046's V4 crash-looped the user
    # service on exactly that. Out of order is allowed here, and only here, because only here are there
    # seeds to be out of order with.
    out-of-order: true
