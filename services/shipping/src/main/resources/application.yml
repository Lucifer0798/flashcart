spring:
  application:
    name: flashcart-shipping
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/flashcart_shipping}
    username: ${SPRING_DATASOURCE_USERNAME:flashcart}
    password: ${SPRING_DATASOURCE_PASSWORD:flashcart}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}
      minimum-idle: 5
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

flashcart:
  version: ${FLASHCART_VERSION:0.1.0-SNAPSHOT}
