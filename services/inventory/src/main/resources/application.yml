spring:
  application:
    name: flashcart-inventory
  data:
    redis:
      # Short, and the shortness is the whole point.
      #
      # The availability gate exists to save a database round trip measured in single milliseconds.
      # Lettuce's default command timeout is sixty seconds, so with Redis unreachable every
      # reservation waited on the optimisation before falling through to the database that was going
      # to answer anyway. ADR 0016 promised that losing Redis costs throughput and nothing else; it
      # said nothing about how long the falling-through takes, and Phase 11's failure injection found
      # requests hanging for twelve seconds and more until the gateway gave up on them.
      #
      # A gate that cannot answer in a quarter of a second has nothing useful to say: PostgreSQL will
      # answer faster than that. Timing out here is the fast path, not the sad path.
      timeout: ${REDIS_TIMEOUT:250ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:250ms}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/flashcart_inventory}
    username: ${SPRING_DATASOURCE_USERNAME:flashcart}
    password: ${SPRING_DATASOURCE_PASSWORD:flashcart}
    hikari:
      # Larger than catalog's pool: this is the write-contended service, and every reserve is a
      # short transaction of a few conditional updates. Still nowhere near unbounded — more
      # connections than the database can usefully run just moves the queue out of the pool, where
      # it can time out and shed load, and into PostgreSQL, where it cannot.
      maximum-pool-size: ${DB_POOL_SIZE:30}
      minimum-idle: 10
      # Fail fast under a stampede. A buyer would rather be told "try again" in two seconds than
      # wait thirty for a connection that will not arrive in time to matter anyway.
      connection-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; ddl-auto would let a stray entity change rewrite it silently.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    template:
      # Producer-side spans. Without this the send is invisible and a trace stops at the caller.
      observation-enabled: true
    listener:
      # Consumer-side spans, and the half that matters: this is what continues the trace across the
      # bus instead of starting a fresh rootless one on the consumer thread.
      observation-enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # health and info for compose/Kubernetes probes; prometheus is claimed in Phase 9.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  tracing:
    propagation:
      # W3C rather than Brave's default B3, because the outbox stores the trace context as a
      # traceparent string and replays it when the relay finally sends. One format in the database,
      # on the wire, and in every header, instead of a translation step nobody remembers.
      type: ${TRACE_PROPAGATION:w3c}
    sampling:
      # Everything, because this is a demonstration stack where the interesting traces are the rare
      # ones -- an injected failure, a compensation, a redelivery. Sampling at 10% would mostly
      # discard exactly the traces Phase 11 exists to look at. A real deployment would not do this.
      probability: ${TRACE_SAMPLING:1.0}
    export:
      zipkin:
        # Boot 4 renamed this from management.zipkin.tracing.endpoint. The old key still appears in
        # the configuration metadata, so it binds without complaint and exports nothing.
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    # The correlation id is stamped into the MDC by CorrelationIdFilter in flashcart-common.
    level: "%5p [${spring.application.name},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

flashcart:
  security:
    jwt:
      # Verifies operator tokens; this service never issues one. See ADR 0022.
      secret: ${JWT_SECRET:flashcart-development-secret-do-not-use-anywhere-real}
      ttl: ${JWT_TTL:PT12H}
  version: ${FLASHCART_VERSION:0.1.0-SNAPSHOT}
  inventory:
    # How long a hold lasts by default: long enough to enter card details, short enough that an
    # abandoned basket does not sit on scarce stock for the whole sale.
    reservation-ttl: ${RESERVATION_TTL:PT15M}
    # The ceiling on a caller-supplied TTL, so no client can park stock indefinitely.
    max-reservation-ttl: ${MAX_RESERVATION_TTL:PT1H}
    # ATOMIC_UPDATE (one conditional UPDATE) or PESSIMISTIC_LOCK (SELECT ... FOR UPDATE). Both are
    # correct; the first holds its row lock for a single statement rather than for the rest of the
    # transaction. Switchable so Phase 10 can measure the difference instead of asserting it.
    strategy: ${RESERVATION_STRATEGY:ATOMIC_UPDATE}
    # How many expired holds one reserve call reclaims inline before getting on with its own work,
    # so an unlucky request never inherits an unbounded backlog.
    lazy-reclaim-limit: ${LAZY_RECLAIM_LIMIT:50}
    # Redis admission control. Only ever refuses; PostgreSQL still decides. Turning it off is a
    # correct deployment, just a slower one — which is what Phase 10 measures against.
    gate:
      enabled: ${AVAILABILITY_GATE_ENABLED:true}
      ttl: ${AVAILABILITY_GATE_TTL:PT60S}
    sweeper:
      enabled: ${SWEEPER_ENABLED:true}
      batch-size: ${SWEEPER_BATCH_SIZE:500}
      fixed-delay: ${SWEEPER_INTERVAL:PT10S}
      initial-delay: PT15S
