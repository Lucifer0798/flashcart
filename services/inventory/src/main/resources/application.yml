spring:
  application:
    name: flashcart-inventory
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/flashcart_inventory}
    username: ${SPRING_DATASOURCE_USERNAME:flashcart}
    password: ${SPRING_DATASOURCE_PASSWORD:flashcart}
    hikari:
      # Larger than catalog's pool: this is the write-contended service, and every reserve is a
      # short transaction of a few conditional updates. Still nowhere near unbounded — more
      # connections than the database can usefully run just moves the queue out of the pool, where
      # it can time out and shed load, and into PostgreSQL, where it cannot.
      maximum-pool-size: ${DB_POOL_SIZE:30}
      minimum-idle: 10
      # Fail fast under a stampede. A buyer would rather be told "try again" in two seconds than
      # wait thirty for a connection that will not arrive in time to matter anyway.
      connection-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; ddl-auto would let a stray entity change rewrite it silently.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # health and info for compose/Kubernetes probes; prometheus is claimed in Phase 9.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

logging:
  pattern:
    # The correlation id is stamped into the MDC by CorrelationIdFilter in flashcart-common.
    level: "%5p [${spring.application.name},%X{correlationId:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

flashcart:
  version: ${FLASHCART_VERSION:0.1.0-SNAPSHOT}
  inventory:
    # How long a hold lasts by default: long enough to enter card details, short enough that an
    # abandoned basket does not sit on scarce stock for the whole sale.
    reservation-ttl: ${RESERVATION_TTL:PT15M}
    # The ceiling on a caller-supplied TTL, so no client can park stock indefinitely.
    max-reservation-ttl: ${MAX_RESERVATION_TTL:PT1H}
    # ATOMIC_UPDATE (one conditional UPDATE) or PESSIMISTIC_LOCK (SELECT ... FOR UPDATE). Both are
    # correct; the first holds its row lock for a single statement rather than for the rest of the
    # transaction. Switchable so Phase 10 can measure the difference instead of asserting it.
    strategy: ${RESERVATION_STRATEGY:ATOMIC_UPDATE}
    # How many expired holds one reserve call reclaims inline before getting on with its own work,
    # so an unlucky request never inherits an unbounded backlog.
    lazy-reclaim-limit: ${LAZY_RECLAIM_LIMIT:50}
    sweeper:
      enabled: ${SWEEPER_ENABLED:true}
      batch-size: ${SWEEPER_BATCH_SIZE:500}
      fixed-delay: ${SWEEPER_INTERVAL:PT10S}
      initial-delay: PT15S
