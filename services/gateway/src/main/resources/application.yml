spring:
  application:
    name: flashcart-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            # A fixed pool per service, not the default elastic one, which opens a connection for every
            # request in flight. At a sale's opening that was 3,594 connections at once to a user service with
            # 200 request threads and an accept queue of 100. The kernel dropped the overflow, and the
            # connections it reset reached shoppers as 503s after 10-30 seconds: every refusal at 4,000
            # shoppers. Capped, the excess waits here, in order, where it is measured, and nobody was refused.
            # See ADR 0074.
            pool:
              type: FIXED
              # More than any service's 200 request threads, so the gateway never starves a service of work.
              max-connections: 500
              # Reactor Netty's own default, written down: past this, a request still waiting for a connection
              # is answered 503 with Retry-After (UpstreamFailureHandler) instead of waiting longer.
              acquire-timeout: 45000
              # Retire a connection after 30 idle seconds, before the service's Tomcat does at 60. Without this,
              # a burst arriving as Tomcat closed a pool of idle connections was sent down them as they closed:
              # 110 and 132 of 200 requests reset after 61 idle seconds, none after 59 or 70. Closed by the
              # gateway, there is no race. See ADR 0076.
              max-idle-time: 30000
              # reactor_netty_connection_provider_*: the queue at the gateway, on the dashboard.
              metrics: true
          default-filters:
            # The gateway stamps X-Correlation-Id on the response, and the downstream service echoes
            # the same header on its own response — so without this the caller receives the header
            # twice. RETAIN_FIRST keeps the gateway's, which is the one that is always present.
            - DedupeResponseHeader=X-Correlation-Id, RETAIN_FIRST
          # Static URIs, not service discovery. Phase 1 has a fixed six-service topology and
          # compose/Kubernetes DNS already resolves the names; adding a registry now would be a
          # moving part with nothing to discover.
          routes:
            - id: catalog
              uri: ${FLASHCART_CATALOG_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/products/**,/api/v1/categories/**,/api/v1/flash-sales/**,/api/v1/catalog/**
            - id: order
              uri: ${FLASHCART_ORDER_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/orders/**,/api/v1/order/**
            - id: user
              uri: ${FLASHCART_USER_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/users/**,/api/v1/user/**
            - id: payment
              uri: ${FLASHCART_PAYMENT_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/payments/**,/api/v1/payment/**
            - id: inventory
              uri: ${FLASHCART_INVENTORY_URI:http://localhost:8085}
              predicates:
                - Path=/api/v1/inventory/**
            - id: shipping
              uri: ${FLASHCART_SHIPPING_URI:http://localhost:8086}
              predicates:
                - Path=/api/v1/shipments/**,/api/v1/shipping/**

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
    gateway:
      # Lets `curl /actuator/gateway/routes` answer "what is this gateway actually routing" without
      # reading the config. Read-only; the mutating route endpoints stay off.
      access: read_only
  tracing:
    propagation:
      # W3C rather than Brave's default B3, because the outbox stores the trace context as a
      # traceparent string and replays it when the relay finally sends. One format in the database,
      # on the wire, and in every header, instead of a translation step nobody remembers.
      type: ${TRACE_PROPAGATION:w3c}
    sampling:
      # Everything: the gateway starts every trace, so sampling here decides what the rest of the
      # platform can be seen doing at all.
      probability: ${TRACE_SAMPLING:1.0}
    export:
      zipkin:
        # Boot 4 renamed this from management.zipkin.tracing.endpoint. The old key still appears in
        # the configuration metadata, so it binds without complaint and exports nothing.
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    org.springframework.cloud.gateway: ${GATEWAY_LOG_LEVEL:INFO}

flashcart:
  gateway:
    dns:
      # The longest the gateway keeps a service's address, whatever TTL the DNS server gave it. Docker's is 600 s,
      # so a service that came back on a new address stayed unreachable through the gateway for up to ten minutes.
      # See ADR 0075 and UpstreamDnsConfig.
      cache-max-time-to-live: ${GATEWAY_DNS_CACHE_MAX_TTL:5s}
  security:
    jwt:
      # The gateway verifies with the same secret the user service signs with. See ADR 0021 for why
      # symmetric is acceptable here and what would change it.
      secret: ${JWT_SECRET:flashcart-development-secret-do-not-use-anywhere-real}
      ttl: ${JWT_TTL:PT12H}
  version: ${FLASHCART_VERSION:0.1.0-SNAPSHOT}
