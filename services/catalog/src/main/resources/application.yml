spring:
  application:
    name: flashcart-catalog
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/flashcart_catalog}
    username: ${SPRING_DATASOURCE_USERNAME:flashcart}
    password: ${SPRING_DATASOURCE_PASSWORD:flashcart}
    hikari:
      # Sized for a service that is read-heavy and short-transaction. More connections than the
      # database has cores buys queueing inside Postgres instead of inside the pool, which is the
      # worse place for it — the pool can at least time out and shed load.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. ddl-auto would let a stray entity change rewrite production silently.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  tracing:
    propagation:
      # W3C rather than Brave's default B3, because the outbox stores the trace context as a
      # traceparent string and replays it when the relay finally sends. One format in the database,
      # on the wire, and in every header, instead of a translation step nobody remembers.
      type: ${TRACE_PROPAGATION:w3c}
    sampling:
      # Everything, because this is a demonstration stack where the interesting traces are the rare
      # ones -- an injected failure, a compensation, a redelivery. Sampling at 10% would mostly
      # discard exactly the traces Phase 11 exists to look at. A real deployment would not do this.
      probability: ${TRACE_SAMPLING:1.0}
    export:
      zipkin:
        # Boot 4 renamed this from management.zipkin.tracing.endpoint. The old key still appears in
        # the configuration metadata, so it binds without complaint and exports nothing.
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

flashcart:
  version: ${FLASHCART_VERSION:0.1.0-SNAPSHOT}

---
# Loaded in compose and locally when you want a catalog with something in it. The seed migrations
# live in a separate Flyway location so demo rows can never reach an environment that did not ask
# for them by name.
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/seed
