spring:
  application:
    name: flashcart-payment
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/flashcart_payment}
    username: ${SPRING_DATASOURCE_USERNAME:flashcart}
    password: ${SPRING_DATASOURCE_PASSWORD:flashcart}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}
      minimum-idle: 5
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

flashcart:
  version: ${FLASHCART_VERSION:0.1.0-SNAPSHOT}
  payment:
    # The simulated provider picks its outcome from the amount's cents, so a declined or timed-out
    # checkout can be demonstrated end to end with nothing but a product price — no test hook in the
    # API, and the trigger survives every hop from the storefront to here.
    decline-on-cents: ${PAYMENT_DECLINE_CENTS:13}
    timeout-on-cents: ${PAYMENT_TIMEOUT_CENTS:99}
    # How long an attempt may sit PENDING before the reconciler gives up waiting on the provider.
    pending-timeout: ${PAYMENT_PENDING_TIMEOUT:PT2M}
    reconciler:
      enabled: ${PAYMENT_RECONCILER_ENABLED:true}
      batch-size: 200
      fixed-delay: PT30S
      initial-delay: PT25S
