# Alerting rules, each one written for a failure this project actually had.
#
# Nothing here fires on a metric being "high". Every rule below describes a state that is wrong on
# its own terms, because a threshold nobody can justify is a threshold that gets silenced.
groups:
  - name: flashcart
    rules:
      - alert: OutboxStalled
        # Depth alone cannot distinguish a busy relay from a dead one: under a flash sale a deep
        # queue is correct. An *old* row is never correct. Two minutes is far beyond the 1s poll.
        expr: flashcart_outbox_oldest_age_seconds > 120
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }}: outbox has not drained for over two minutes"
          description: >
            The relay swallows its own exceptions so that a transient failure does not stop it being
            rescheduled, which means a dead relay looks completely healthy: HTTP still answers, the
            service is UP, and nothing new ever reaches the bus. Sagas in flight will stop silently.
            Check the relay logs and outbox_messages.last_error.

      - alert: OutboxSendFailing
        # A single poisoned row retried every tick climbs here while depth stays at one -- a
        # different shape from a broker outage, and worth telling apart.
        expr: rate(flashcart_outbox_send_failures_total[2m]) > 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }}: outbox sends are failing"

      - alert: AvailabilityGateBlind
        # UNKNOWN means Redis said nothing. Correctness is unaffected -- PostgreSQL still decides --
        # so the platform degrades to Phase 6 performance and looks perfectly healthy while doing it.
        # That silence is the whole reason this alert exists.
        expr: rate(flashcart_gate_decisions_total{decision="unknown"}[5m]) > 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "inventory: the availability gate is returning UNKNOWN steadily"
          description: >
            Redis is unreachable or the counters are never warming. Every reservation is going
            straight to PostgreSQL. Nothing is incorrect; the gate is simply not doing anything.

      - alert: SagaTransitionsDeclined
        # Before Phase 8 this guard doubled as the deduplicator, so a decline was routine and
        # unalertable. Now that processed_events catches duplicates first, a decline means a
        # transition was genuinely attempted that should not have been.
        expr: rate(flashcart_saga_transitions_declined_total[5m]) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "order: the state machine is refusing transitions"
          description: >
            Duplicates are caught by processed_events before reaching the guard, so this is not
            redelivery. Something is driving an order into a state it cannot reach from.

      - alert: OperatorReadsUnrecordable
        # Not a volume alert. ADR 0018's rule is that an alert describes a state which is wrong on
        # its own terms, never a metric being high -- and "operators are reading a lot today" is a
        # business fact, not a fault. This is the fault: the service cannot write to
        # operator_access_log, so by ADR 0025 it is refusing every operator read of another
        # customer's data rather than serving one unrecorded. From outside that looks like a rise in
        # 500s on a handful of endpoints, which is the least informative thing it could look like.
        expr: rate(flashcart_operator_read_record_failures_total[5m]) > 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }}: operator reads are being refused because the audit write fails"
          description: >
            operator_access_log is unwritable -- missing, out of space, or the role lost its grant.
            Customers reading their own data are unaffected; only operator access to somebody else's
            is refused, and deliberately so: an unrecorded operator read is the one thing this
            platform will not serve.

      - alert: RefundRefused
        # Its sibling, flashcart_payment_refunds_total{outcome="completed"}, has no alert and should
        # not: how many customers cancelled today is a business fact. This one is wrong on its own
        # terms. The provider would not reverse a capture for an order the platform has already told
        # the customer is cancelled, so every other part of the system believes they have been made
        # whole and only the payments row disagrees. Nothing retries it yet -- ADR 0030 -- so this
        # alert is currently the only thing that will ever notice.
        expr: increase(flashcart_payment_refunds_total{outcome="refused"}[15m]) > 0
        # No `for`, unlike the alert above. That one waits to distinguish a blip from a broken table;
        # here a single occurrence is already the whole fault, and waiting would only delay it.
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "payment: a refund was refused and the money is still held"
          description: >
            One or more captures could not be reversed. The orders are CANCELLED and the payments are
            REFUND_FAILED, which is money owed to a customer who has been told they are getting it
            back. The retry job (ADR 0031) is attempting these automatically; if it succeeds this
            stops on its own. Find them with: select * from payments where status = 'REFUND_FAILED'.

      - alert: RefundAbandoned
        # The escalation of the alert above, and the one that means nothing further will happen on
        # its own. The retry job has hit its attempt cap, so the platform has stopped trying to
        # return money it still owes for an order the customer was told is cancelled. Wrong on its
        # own terms in the strongest sense available here: every other part of the system believes
        # this customer has been made whole.
        expr: increase(flashcart_payment_refunds_abandoned_total[30m]) > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "payment: gave up refunding a customer; the money is still owed"
          description: >
            A refund was refused on every attempt up to the cap. Nothing will retry it again, and the
            payment is still REFUND_FAILED and still refundable -- giving up on retrying is not a
            decision that the money is not owed. This needs somebody to talk to the provider.
            select order_number, amount, currency, customer_id, refund_attempts, failure_reason
              from payments where status = 'REFUND_FAILED' order by updated_at desc;

      - alert: CancellationsUnanswered
        # Not "a cancellation was re-asked" -- one re-ask is a lost message, which is what the
        # backstop is for and is not a fault. This fires when re-asking is not working: the rate has
        # not fallen back to zero, so the platform is putting the same question to shipping every
        # timeout and getting nothing. The orders behind it are stuck in CANCELLATION_REQUESTED,
        # where the customer is told neither that they were refunded nor that they were not.
        expr: rate(flashcart_order_cancellations_unanswered_total[10m]) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "order: cancellation requests are going unanswered"
          description: >
            Shipping is not answering CancelShipment. Check that the shipping service is up and its
            flashcart-shipping-cancel consumer group is not lagging, then look for the commands in
            the DLQ. Affected orders:
            select order_number, updated_at from orders where status = 'CANCELLATION_REQUESTED';
