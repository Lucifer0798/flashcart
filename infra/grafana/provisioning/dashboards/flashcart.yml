apiVersion: 1
providers:
  - name: flashcart
    type: file
    disableDeletion: true
    # Dashboards live in the repo and are read-only in the UI: a dashboard edited in Grafana and not
    # committed is lost on the next `docker compose down -v`, which is the worst of both worlds.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
